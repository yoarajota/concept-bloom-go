driving_characteristics:
- performance-efficiency
- reliability
utility_tree:
- id: S-001
  characteristic: performance-efficiency
  sub_attribute: time-behaviour
  scenario: 'When 32 goroutines perform 1,000,000 Load() operations against a sync.Map with 50 % absent
    keys and the Bloom filter pre-check enabled, the p99 miss latency is at least 20 % lower than when
    the pre-check is absent, measured as p99 miss-latency in nanoseconds over 5 runs.

    '
  priority: high
  difficulty: high
  verification: bench/miss_latency_test.go
  status: fail
  evidence_refs:
  - E-003
- id: S-002
  characteristic: reliability
  sub_attribute: fault-tolerance
  scenario: 'When the Bloom filter''s false-positive rate climbs because inserted keys surpass the capacity
    design point, the system continues to serve correct Load() results (the Bloom filter is a pre-check,
    not a replacement), measured as zero incorrect returns under a miss-heavy workload where 10 % of absent-key
    queries hit a false positive.

    '
  priority: high
  difficulty: medium
  verification: bench/miss_latency_test.go
  status: pass
  evidence_refs:
  - E-002
- id: S-003
  characteristic: maintainability
  sub_attribute: modifiability
  scenario: 'When the Bloom filter implementation is swapped for a different hashing strategy (e.g. fnv
    to xxhash), a competent engineer applies it by touching at most 2 files (the Bloom type and its constructor),
    measured as files changed in the reference patch.

    '
  priority: medium
  difficulty: medium
  verification: docs/04-tradeoffs.md
  status: unverified
  evidence_refs: []
